# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: the base
# images in the Dockerfile (golang, distroless) and the hadolint image
# digest in lefthook.yml/ci.yml. All three are digest-pinned and none of them
# live anywhere Dependabot's ecosystems look.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and
      # the version number is computed from them. chore: releases nothing,
      # which is right for a dependency bump that changed no behaviour.
      prefix: chore
      include: scope
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # Nothing here is JavaScript. package.json exists so commitlint can
  # resolve the shared config it extends, which bunx alone cannot do.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
