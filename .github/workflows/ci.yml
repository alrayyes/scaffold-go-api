# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same version the pre-commit hook runs. When these two disagree the
  # hook passes and the pipeline fails, and the reason isn't obvious from the
  # failure.
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: gofmt
        # golangci-lint's formatter reports rather than rewrites here; this
        # is the check that a file was committed unformatted.
        run: gofmt -l . | (! grep .)

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        # -coverpkg=./..., not the default: without it, coverage only counts
        # each package's own tests, and a thin handler package under-reports
        # since the logic it calls lives elsewhere.
        #
        # gotestsum instead of a bare `go test`, pinned exactly: same human
        # output as before, plus a JUnit report Codecov's Test Analytics
        # reads for failure/flake history.
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- \
            -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      # GitHub withholds repository Actions secrets from Dependabot-triggered
      # runs entirely, pull_request vs. pull_request_target notwithstanding
      # — only a separate "Dependabot secrets" store reaches them, and this
      # repo doesn't keep a second copy of CODECOV_TOKEN there. Skip rather
      # than upload with an empty token: fail_ci_if_error would otherwise
      # turn that into a permanently red check no Dependabot PR can pass,
      # which blocks dependabot-auto-merge.yml's gate for good.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      # Run even when tests fail - a red PR is exactly the case Test
      # Analytics exists to explain, and a job that stops at the first
      # failing test never reaches an upload step gated behind success.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  # No check-only flag on `go mod edit -fmt`, so this is the pre-commit
  # fixer's twin from lefthook.yml: run it again and diff.
  gomod:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod

  dockerfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        # The same pinned digest the pre-commit hook runs, so the two
        # cannot disagree about the version.
        run: >-
          docker run --rm -i
          -v ${{ github.workspace }}/.hadolint.yaml:/.hadolint.yaml
          hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile

  # Proves the image still builds before anyone merges, without publishing
  # anything. There's no registry to push it to — this template doesn't wire
  # one up; a project stamped from it adds that the day it needs one.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build .

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The API description is a contract. This proves the document is valid
  # OpenAPI; nothing here proves the handler still matches it — see
  # CONTRIBUTING.md's "The contract" section for the gap.
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: redocly lint
        run: bun run lint:api -- --format=github-actions

  # Publishes the Stoplight Elements docs page — the renderer for the same
  # spec the `api` job lints. Lives in this workflow, not a separate one, so
  # `needs: api` is a real dependency: GitHub can't express `needs` across
  # workflow files, and the `api` job itself only runs on `push` to `main`
  # and on `pull_request`, so gating here on the `push` event is what makes
  # "merged and linted" the actual precondition rather than an assumption.
  pages:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stage the spec beside the docs page
        # The artifact below is docs/ alone, so a path outside it isn't
        # reachable once Pages serves it — see docs/index.html's comment.
        run: cp api/openapi.yaml docs/openapi.yaml
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
