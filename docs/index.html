<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>scaffold-go-api</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin: 0">
    <!--
      openapi.yaml here is a copy of api/openapi.yaml, staged by the pages
      workflow right before actions/upload-pages-artifact runs — the
      artifact is this directory alone, so a path outside it isn't reachable
      once Pages serves it. Don't hand-edit this copy; it's overwritten on
      every publish.
    -->
    <div id="app"></div>
    <script type="module">
      import { createApiReference } from 'https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.1/esm.js'
      createApiReference('#app', { url: './openapi.yaml' })
    </script>
  </body>
</html>
