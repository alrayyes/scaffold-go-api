# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: docker
    container:
      # Version-pinned by the image tag itself, so there's nothing separate
      # to keep in sync with a golangci-lint-action version the way GitHub's
      # workflow needed. This image is built FROM golang, so `go` and
      # `gofmt` are on PATH too.
      image: golangci/golangci-lint:v2.12.2@sha256:5cceeef04e53efe1470638d4b4b4f5ceefd574955ab3941b2d9a68a8c9ad5240
    steps:
      # actions/checkout is a JavaScript action and needs node; installing
      # git pulls in the need for ca-certificates too, since git reads the
      # system CA store a minimal image hasn't got. Base image's package
      # manager isn't fixed across every image this workflow uses, hence
      # the apk/apt branch — see FORGEJO.md.
      - run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache ca-certificates git nodejs
          else
            apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
          fi
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: golangci-lint
        run: golangci-lint run
      - name: gofmt
        # golangci-lint's formatter reports rather than rewrites here; this
        # is the check that a file was committed unformatted.
        run: gofmt -l . | (! grep .)

  test:
    runs-on: docker
    container:
      image: golang:1.26-bookworm@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3b3fbba0aea53d2
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: go test
        # -coverpkg=./..., not the default: without it, coverage only counts
        # each package's own tests, and a thin handler package under-reports
        # since the logic it calls lives elsewhere.
        run: go test -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: docker
    container:
      image: golang:1.26-bookworm@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3b3fbba0aea53d2
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: go build ./...

  # No check-only flag on `go mod edit -fmt`, so this is the pre-commit
  # fixer's twin from lefthook.yml: run it again and diff.
  gomod:
    runs-on: docker
    container:
      image: golang:1.26-bookworm@sha256:6ef6e30f0ea5c384f6d111cf856e024e3086bbdcb1779da3f3b3fbba0aea53d2
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod

  # Docker-outside-of-Docker: the job container gets the host's own docker
  # socket rather than running a nested daemon, since Forgejo's `runs-on:
  # docker` jobs run inside a container to begin with (unlike GitHub's
  # `ubuntu-24.04`, a bare VM with Docker preinstalled). Whether the actual
  # runner behind this instance permits the socket mount is a property of
  # that runner's own config (FORGEJO.md's `valid_volumes` note) — if these
  # two jobs fail on a permission or missing-socket error rather than a real
  # Dockerfile/build problem, that's the runner, not this workflow.
  dockerfile:
    runs-on: docker
    container:
      image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: hadolint
        # The same pinned digest the pre-commit hook and GitHub's workflow
        # ran.
        run: >-
          docker run --rm -i
          -v ${{ github.workspace }}/.hadolint.yaml:/.hadolint.yaml
          hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile

  # Proves the image still builds before anyone merges, without publishing
  # anything. There's no registry to push it to — this template doesn't wire
  # one up; a project stamped from it adds that the day it needs one.
  docker:
    runs-on: docker
    container:
      image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
      options: -v /var/run/docker.sock:/var/run/docker.sock
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: docker build .

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: docker
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The API description is a contract. This proves the document is valid
  # OpenAPI; nothing here proves the handler still matches it — see
  # CONTRIBUTING.md's "The contract" section for the gap.
  api:
    runs-on: docker
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: bun install --frozen-lockfile
      - name: redocly lint
        run: bun run lint:api

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
