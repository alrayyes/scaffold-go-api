# commitlint checks individual commit messages inside a pull request; it
# never sees the pull request title. On a squash merge, the squash commit
# message defaults to that title — so a title reading "fixed stuff" squashes
# straight past commitlint and lands exactly that on main, and
# semantic-release reads that landed message to decide the next version.
#
# Runs commitlint directly against the title rather than a marketplace
# action: GitHub's amannn/action-semantic-pull-request has no Forgejo
# mirror, and there's no fork-PR trust boundary to route around here (a
# personal repo, only the owner and its bot collaborators open pull
# requests) — plain `pull_request` is enough, no *_target variant needed.
name: pr-title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: docker
    container:
      image: oven/bun:1.4.0-alpine@sha256:07235578f79ef8c6f97d94aee7938e76f5cdba5f21ae5dbfdd3d3d38058437eb
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: commitlint the pull request title
        # Reuses the same config the commit-message hook and the commits
        # job in ci.yml check against, so the two cannot disagree about
        # what's a valid type.
        run: echo "${{ github.event.pull_request.title }}" | bunx commitlint --verbose
