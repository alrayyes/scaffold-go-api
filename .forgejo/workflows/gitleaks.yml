# Deliberately ungated: a secret can be committed to any file, so there's no
# diff this is safe to skip for — no `paths:` filter, unlike prose.yml.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like everything else. go install can pin a binary by tag; no
  # separate download step or container image needed for that.
  GITLEAKS_VERSION: v8.30.1

jobs:
  secrets:
    runs-on: docker
    container:
      image: golang:1.27-bookworm@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      # fetch-depth: 0, or there's no history to walk and the job passes
      # having scanned nothing.
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # The module's import path is zricethezav/gitleaks; gitleaks/gitleaks
        # is only where the repository lives on GitHub.
        run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - run: gitleaks git --redact --no-banner --log-opts="--branches --tags" .
