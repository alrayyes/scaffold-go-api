# The two tiers markdownlint doesn't cover.
#
# Layout is Prettier and structure is markdownlint, both in the ci workflow.
# Those pass a document that reads badly: neither notices "an university",
# "the the", or a paragraph that has quietly gone passive.
#
# Mechanics and style are separate jobs on purpose. When this goes red the
# job name should say which tier failed, because a grammar mistake and a
# style opinion are answered differently — one is wrong, the other is a
# suggestion.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .forgejo/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .forgejo/workflows/prose.yml

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned like everything else. Vale's style packages are versioned
  # separately and fetched by `vale sync`.
  VALE_VERSION: v3.17.1
  # ltex-ls-plus is pinned inside scripts/lint-mechanics.sh instead, so the
  # hook and this workflow cannot install different versions of it.

jobs:
  # Mechanics: grammar, spelling, the phonetic article. These have a right
  # answer, so this one fails the build.
  mechanics:
    runs-on: docker
    container:
      image: golang:1.27-bookworm@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Check the prose this repository owns
        # The same script the pre-push hook runs, so the two cannot disagree
        # about the version, the file list or what counts as a failure.
        run: ./scripts/lint-mechanics.sh

  style:
    runs-on: docker
    container:
      image: golang:1.27-bookworm@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install Vale
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/errata-ai/vale/v3/cmd/vale@${{ env.VALE_VERSION }}
      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what's worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh
      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
