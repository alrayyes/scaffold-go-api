version: 2

project_name: scaffold-go-api

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/scaffold-go-api
    env:
      - CGO_ENABLED=0
    # Linux only, unlike a CLI scaffold's wider matrix: this is a deployed
    # service, meant to run in a container on a server, not on someone's own
    # machine.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The version the binary reports comes from the tag, so a running
    # container can be asked what it is without going back to CI to look it
    # up.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Forgejo speaks the Gitea release API, not GitHub's — goreleaser's
# GitHub-shaped defaults don't resolve here without this block. See
# FORGEJO.md.
gitea_urls:
  api: https://git.higherlearning.eu/api/v1
  download: https://git.higherlearning.eu

# The Forgejo runner exports its own GITHUB_TOKEN for GitHub-Actions
# compatibility, alongside the GITEA_TOKEN the release workflow sets —
# goreleaser refuses to guess between them ("multiple tokens found, but
# only one is allowed") without this.
force_token: gitea

# semantic-release already wrote the notes, curated from the same commits,
# and created the release carrying them. A second shortlog generated here
# would put them on twice, and `release.mode: replace` would throw the
# curated copy away — so the changelog is off and `release.mode` stays at
# its default, keep-existing. goreleaser is only hanging binaries on a
# release that exists.
changelog:
  disable: true
